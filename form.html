<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05: Product Review Form</title>
    <meta name="description" content="WDD 131  Dynamic Web Fundamentals  Luis Quezada. This is product review form">
    <meta name="author" content="Luis Quezada">
    <link rel="stylesheet" href="styles/form.css">
    <script src="./scripts/form.js" defer ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <span id="course-title">Product Review</span>
    </header>

    <main>
        <form action="review.html" method="get" id="reviewform">
            <label for="pname" class="tittle">Product Name
                <select name="pname" id="pname" required>
                    <option value="" disabled selected>Select a Product</option>
                </select>
            </label>

            <div class="tittle">Overall Rating</div>
                <label for="onestar">
                    <input type="radio" id="onestar" name="rating" value="1" required>
                    ☆
                </label>

                <label for="twostar">
                    <input type="radio" id="twostar" name="rating" value="2" required>
                    ☆☆
                </label>

                <label for="threestar">
                    <input type="radio" id="threestar" name="rating" value="3" required>
                    ☆☆☆
                </label>

                <label for="fourstar">
                    <input type="radio" id="fourstar" name="rating" value="4" required>
                    ☆☆☆☆
                </label>

                <label for="fivestar">
                    <input type="radio" id="fivestar" name="rating" value="5" required>
                    ☆☆☆☆☆
                </label>
            
            <label for="date" class="tittle">Date of installation</label>
            <input type="date" name="date" id="date" required>

            <div class="tittle">Which features did you find useful in the product? <span class="all-applied"> (Check all that apply)</span></div>
            
                <label for="durability"><input type="checkbox" name="durability" id="durability">Durability</label>
                <label for="easy"><input type="checkbox" name="easy" id="easy">Easy of Use</label>
                <label for="performance"><input type="checkbox" name="performance" id="performance">Performance</label>
                <label for="design"><input type="checkbox" name="design" id="design">Design</label>
        
        
            <label for="review" class="tittle">Written Review <span class="optional">(Optional)</span></label>
            <textarea name="review" id="review"></textarea>

            <label for="username" class="tittle">Your Name<span class="optional">(Optional)</span></label>
            <input type="text" name="username" id="username">


            <input type="submit" name="submit" id="submitreview" value="Post Review">
        </form>

             
    </main>

    <footer>
        <p><span>©<span id="current-year"></span> ❖ Luis Quezada ❖ Qro, México</span></p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
    
</body>
</html>
